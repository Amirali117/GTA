<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Grand Theft Auto VI | Rockstar Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
    }

    /* ========== BACKGROUND ========== */
    /* Replace "bg.jpg" with your own background image */
    .bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          100deg,
          rgba(0, 0, 0, 0.82) 0%,
          rgba(0, 0, 0, 0.55) 32%,
          rgba(0, 0, 0, 0.25) 55%,
          rgba(0, 0, 0, 0.1) 100%
        ),
        url('bg.jpg') center center / cover no-repeat;
      z-index: 0;
      transform: scale(1.08);
      animation: bgZoom 12s ease-out forwards;
    }

    @keyframes bgZoom {
      to { transform: scale(1); }
    }

    /* Black overlay that fades out (Rockstar-style intro) */
    .intro-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10;
      animation: fadeOutOverlay 1.4s ease-out 0.3s forwards;
      pointer-events: none;
    }

    @keyframes fadeOutOverlay {
      to { opacity: 0; visibility: hidden; }
    }

    .page {
      position: relative;
      z-index: 2;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.8rem 2rem 1.5rem;
    }

    /* ========== TOP BAR ========== */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      transform: translateY(-12px);
      animation: fadeUp 0.8s ease-out 1.1s forwards;
    }

    .rockstar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: #fff;
    }

    /* Replace "logo.png" with your own logo image */
    .rockstar-logo img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .rockstar-logo span {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* ========== MAIN CONTENT ========== */
    .content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 540px;
      margin-bottom: 1vh;
    }

    .eyebrow {
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #ff4d9e;
      margin-bottom: 1rem;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.7s ease-out 1.3s forwards;
    }

    h1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: clamp(2.6rem, 7vw, 5.2rem);
      line-height: 0.92;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      margin-bottom: 1.3rem;
      color: #fff;
      text-shadow: 0 4px 24px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(22px);
      animation: fadeUp 0.8s ease-out 1.45s forwards;
    }

    .tagline {
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      font-weight: 400;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 2.4rem;
      max-width: 400px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.75s ease-out 1.65s forwards;
    }

    /* Primary CTA */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1.05rem 2.3rem;
      background: #ff4d9e;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(255, 77, 158, 0.35);
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s ease-out 1.85s forwards;
    }

    .cta:hover {
      background: #ff6bb0;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 77, 158, 0.5);
    }

    .cta:active {
      transform: translateY(0);
    }

    .cta svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ========== FOOTER ========== */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 1.3rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.7s ease-out 2.1s forwards;
    }

    .footer-left {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-left .credit {
      color: #ff4d9e;
      font-weight: 600;
      letter-spacing: 0.06em;
      position: relative;
    }

    .footer-left .credit::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 1px;
      background: #ff4d9e;
      opacity: 0.6;
    }

    .footer-right {
      display: flex;
      gap: 1.6rem;
      flex-wrap: wrap;
    }

    .footer-right a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .footer-right a:hover {
      color: #ff4d9e;
    }

    /* Shared entrance animation */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 640px) {
      .page {
        padding: 1.3rem 1.2rem 1.1rem;
      }

      .rockstar-logo span {
        font-size: 0.85rem;
        letter-spacing: 0.12em;
      }

      .rockstar-logo img {
        width: 28px;
        height: 28px;
      }

      h1 {
        font-size: 2.5rem;
      }

      .tagline {
        margin-bottom: 2rem;
      }

      .cta {
        padding: 0.95rem 1.7rem;
      }

      footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.9rem;
      }

      .footer-right {
        gap: 1.2rem;
      }
    }

    @media (max-width: 380px) {
      h1 {
        font-size: 2.2rem;
      }

      .rockstar-logo span {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Rockstar-style black fade intro -->
  <div class="intro-overlay"></div>

  <div class="bg"></div>

  <div class="page">
    <!-- Top bar -->
    <header class="top">
      <a href="https://www.rockstargames.com/" class="rockstar-logo" target="_blank" rel="noopener">
        <!-- Replace logo.png with your own image -->
        <img src="logo.png" alt="Rockstar Games">
        <span>Rockstar Games</span>
      </a>
    </header>

    <!-- Main -->
    <main class="content">
      <div class="eyebrow">Vice City, USA</div>
      <h1>Grand Theft<br>Auto VI</h1>
      <p class="tagline">
        Jason and Lucia have always known the deck is stacked against them.
        When an easy score goes wrong, they find themselves on the darkest side
        of the sunniest place in America.
      </p>

      <a class="cta" href="https://www.rockstargames.com/VI/" target="_blank" rel="noopener">
        Visit Official Site
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </a>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-left">
        Made by <span class="credit">Friday</span>
      </div>
      <nav class="footer-right">
        <a href="https://www.rockstargames.com/VI/" target="_blank" rel="noopener">GTA VI</a>
        <a href="https://www.rockstargames.com/" target="_blank" rel="noopener">Rockstar</a>
        <a href="https://www.rockstargames.com/VI/media" target="_blank" rel="noopener">Media</a>
        <a href="https://store.rockstargames.com/game/buy-gta-vi" target="_blank" rel="noopener">Pre-Order</a>
      </nav>
    </footer>
  </div>
</body>
</html>
